# cargo-deny v0.20+ configuration

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore advisories in transitive deps of optional framework features
ignore = [
    "RUSTSEC-2024-0384", # instant - unmaintained (used by iced transitively)
    "RUSTSEC-2024-0436", # paste - unmaintained (used by dioxus transitively)
    "RUSTSEC-2025-0052", # async-std - unmaintained (used by gpui transitively)
    "RUSTSEC-2025-0134", # proc-macro-error2 - unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2 - unmaintained
    "RUSTSEC-2026-0194", # quick-xml - DoS in XML parsing (not used in our core)
    "RUSTSEC-2026-0195", # quick-xml - DoS in XML parsing (not used in our core)
    "RUSTSEC-2026-0206", # quick-xml related
    "RUSTSEC-2026-0192", # ttf-parser - unmaintained (used by font rendering deps)
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "LicenseRef-UFL-1.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
