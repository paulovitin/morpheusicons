[package]
name = "morpheusicons"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["paulovitin"]
description = "A universal, physics-based morphing icon library inspired by morphicons, designed for GPUI, egui, and any Rust GUI framework."
license = "MIT OR Apache-2.0"
repository = "https://github.com/paulovitin/morpheusicons"
keywords = ["icon", "morphing", "gpui", "gui", "animation"]
categories = ["gui", "graphics", "rendering"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "catalog"]
std = []
catalog = []
wasm = ["dep:wasm-bindgen"]
gpui = ["dep:gpui"]
egui = ["dep:egui"]
leptos = ["dep:leptos"]
dioxus = ["dep:dioxus"]
iced = ["dep:iced"]
serde = ["dep:serde"]

[dependencies]
gpui = { version = "0.2.2", optional = true }
egui = { version = "0.29", optional = true }
leptos = { version = "0.7", optional = true }
dioxus = { version = "0.6", optional = true }
iced = { version = "0.13", optional = true, features = ["svg"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
anyhow = "1.0"

[dev-dependencies]
gpui = "0.2.2"
egui = "0.29"
eframe = "0.36"
