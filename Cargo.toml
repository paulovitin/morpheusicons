[package]
name = "morpheusicons"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
authors = ["paulovitin"]
description = "A universal, physics-based morphing icon library inspired by morphicons, designed for GPUI, egui, and any Rust GUI framework."
license = "MIT OR Apache-2.0"
repository = "https://github.com/paulovitin/morpheusicons"
keywords = ["icon", "morphing", "gpui", "gui", "animation"]
categories = ["gui", "graphics", "rendering"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "catalog"]
std = []
catalog = []
wasm = ["dep:wasm-bindgen"]
gpui = ["dep:gpui"]
egui = ["dep:egui"]
leptos = ["dep:leptos"]
dioxus = ["dep:dioxus"]
iced = ["dep:iced"]
serde = ["dep:serde"]

[dependencies]
gpui = { version = "0.2.2", optional = true }
egui = { version = "0.36", optional = true }
leptos = { version = "0.8", optional = true }
dioxus = { version = "0.7", optional = true }
iced = { version = "0.14", optional = true, features = ["svg"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
anyhow = "1.0"
# Pin termcolor <1.4 to avoid breaking change that removed `impl WriteColor for String`
# needed by naga (via codespan-reporting) used transitively by iced/wgpu
termcolor = ">=1.0, <1.4"
# Force naga's termcolor feature to avoid WriteColor compile error
naga = { version = "27", default-features = false, features = ["termcolor"] }

[dev-dependencies]
gpui = "0.2.2"
egui = "0.36"
eframe = "0.36"

[[example]]
name = "gpui_morph_demo"
required-features = ["gpui"]

[[example]]
name = "iced_morph_demo"
required-features = ["iced"]

[[example]]
name = "egui_morph_demo"
required-features = ["egui"]

[[example]]
name = "rust_ui_integration"
required-features = ["egui"]

[[example]]
name = "cli_morph"
required-features = []

[[example]]
name = "web_server"
required-features = []

[profile.dev]
debug = 1

[profile.test]
debug = 1

